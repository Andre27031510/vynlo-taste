services:
  postgres:
    image: postgres:15-alpine
    container_name: vynlo-postgres
    environment:
      POSTGRES_DB: vynlotech
      POSTGRES_USER: vynlo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vynlo_pass_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [vynlo-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vynlo_user -d vynlotech"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: vynlo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [vynlo-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    image: ghcr.io/andre27031510/vynlotaste-backend:latest
    container_name: vynlo-backend
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase-service-account.json
      FIREBASE_CONFIG: /app/firebase-service-account.json
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vynlotech
      DB_USERNAME: vynlo_user
      DB_PASSWORD: ${DB_PASSWORD:-vynlo_pass_2024}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: 
      REDIS_DATABASE: 0
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_change_in_production}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      # Datasource/Hikari - evitar erro de commit com autocommit
      SPRING_DATASOURCE_HIKARI_AUTO_COMMIT: "false"
      # Spring Boot Actuator health config (fix enum binding)
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_COMPONENTS: ALWAYS
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: ALWAYS
      # Spring Mail (AWS SES)
      SPRING_MAIL_HOST: email-smtp.${SES_REGION:-us-east-1}.amazonaws.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${SES_SMTP_USERNAME}
      SPRING_MAIL_PASSWORD: ${SES_SMTP_PASSWORD}
      SPRING_MAIL_PROTOCOL: smtp
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: "true"
      SPRING_MAIL_PROPERTIES_MAIL_DEBUG: "false"
      # Hibernate/DataSource ajustes de transação
      SPRING_JPA_PROPERTIES_HIBERNATE_CONNECTION_PROVIDER_DISABLES_AUTOCOMMIT: "true"
      SPRING_DATASOURCE_HIKARI_TRANSACTION_ISOLATION: TRANSACTION_READ_COMMITTED
    volumes:
      - /opt/secrets/firebase-service-account.json:/app/firebase-service-account.json:ro
    # Backend port NOT exposed to host - only accessible via Nginx proxy
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [vynlo-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: ghcr.io/andre27031510/vynlotaste-frontend:latest
    container_name: vynlo-frontend-prod
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
    networks: [vynlo-network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: vynlo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks: [vynlo-network]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: vynlo-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [vynlo-network]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  vynlo-network: