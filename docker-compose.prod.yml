services:
  postgres:
    image: postgres:15-alpine
    container_name: vynlo-postgres
    environment:
      POSTGRES_DB: vynlotaste
      POSTGRES_USER: vynlo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vynlo-network

  redis:
    image: redis:7-alpine
    container_name: vynlo-redis
    ports:
      - "6379:6379"
    # FASE 1: Proteção OOM Redis + Performance
    command: >
      redis-server 
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60
      --maxclients 10000
    restart: unless-stopped
    networks:
      - vynlo-network

  backend:
    image: ghcr.io/andre27031510/vynlotaste-backend:latest
    container_name: vynlo-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SSL_ENABLED: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vynlotaste
      DB_USERNAME: vynlo_user
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      MAIL_HOST: smtp.gmail.com
      MAIL_USERNAME: noreply@vynlotech.com
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      # ✅ CORREÇÃO CRÍTICA: Variáveis AWS para Firebase Admin via Secrets Manager
      AWS_REGION: us-east-1
      aws.region: us-east-1
      firebase.aws-secret-name: vynlo-taste-firebase-prod
      # Credenciais via IAM Role (IMDS) - RECOMENDADO em EC2/ECS
      # Ou via AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY se necessário
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - vynlo-network
    healthcheck:
      # IMPORTANTE: /api/actuator/health (não /api/api/actuator)
      # context-path (/api) + base-path (/actuator) = /api/actuator
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: ghcr.io/andre27031510/vynlotaste-frontend:latest
    container_name: vynlo-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
      # NEXT_PUBLIC_API_URL não funciona em runtime - deve ser definida no BUILD
      # A URL correta é configurada no pipeline: https://api.vynlotech.com
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vynlo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ============================================================================
  # PROMETHEUS - Metrics Collection (Fase 2)
  # ============================================================================
  # Coleta métricas do backend via Spring Boot Actuator
  # Interface Web: http://localhost:9090
  # Usado pelas Big Techs: Google, Netflix, Uber, Spotify
  # Padrão CNCF: 94% das empresas cloud-native usam Prometheus
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: vynlo-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - vynlo-network
    depends_on:
      - backend

  # ============================================================================
  # GRAFANA - Dashboards & Visualization (Fase 2)
  # ============================================================================
  # Visualização de métricas em dashboards profissionais
  # Interface Web: http://localhost:3001
  # Login padrão: admin/admin (trocar na primeira vez)
  # Usado pelas Big Techs: Google, Meta, Amazon, Microsoft
  # 10+ milhões de instalações ativas globalmente
  # ============================================================================
  grafana:
    image: grafana/grafana:10.1.5
    container_name: vynlo-grafana
    ports:
      - "3001:3000"  # Porta 3001 (3000 usado pelo frontend)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - vynlo-network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  vynlo-network:
    driver: bridge

# ALB optimized configuration
# Fase 2: Monitoring adicionado (Prometheus + Grafana)