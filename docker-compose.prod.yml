services:
  postgres:
    image: postgres:15-alpine
    container_name: vynlo-postgres
    environment:
      POSTGRES_DB: vynlotaste
      POSTGRES_USER: vynlo_user
      POSTGRES_PASSWORD: 96043020
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - vynlo-network

  redis:
    image: redis:7-alpine
    container_name: vynlo-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - vynlo-network

  backend:
    image: ghcr.io/andre27031510/vynlotaste-backend:latest
    container_name: vynlo-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SSL_ENABLED: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: vynlotaste
      DB_USERNAME: vynlo_user
      DB_PASSWORD: 96043020
      REDIS_HOST: redis
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      MAIL_HOST: smtp.gmail.com
      MAIL_USERNAME: noreply@vynlotech.com
      MAIL_PASSWORD: dummy
    expose:
      - "8080"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - vynlo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: ghcr.io/andre27031510/vynlotaste-frontend:latest
    container_name: vynlo-frontend
    environment:
      NODE_ENV: production
      PORT: 3000
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - vynlo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:

networks:
  vynlo-network:
    driver: bridge

# ALB optimized configuration