spring:
  datasource:
    url: jdbc:postgresql://3.92.86.250:5432/vynlotaste
    username: vynlo_user
    password: 96043020
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 60000      # ✅ Aumentado para 60s (era 30s)
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1  # ✅ Testar conexão antes de usar
      validation-timeout: 5000        # ✅ Timeout para validação

  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 5000ms

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cache:
    type: simple  # ✅ Usar cache simples em dev para evitar dependência de Redis
    cache-names: users,products,orders

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always

vynlo:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
      - http://127.0.0.1:3000
      - http://127.0.0.1:3001
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
      - PATCH
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

logging:
  level:
    com.vynlotaste: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 8080