spring:
  main:
    allow-bean-definition-overriding: true
  flyway:
    lock-retry-count: 50
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    mixed: true
    locations: classpath:db/migration
  datasource:
    url: jdbc:postgresql://localhost:5432/vynlo_taste
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:96043020}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  cache:
    redis:
      time-to-live: 300000 # 5 minutos para dev

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

firebase:
  project-id: ${FIREBASE_PROJECT_ID:vynlo-taste-dev}
  credentials-path: ${FIREBASE_CREDENTIALS:./config/firebase-dev.json}
  auth:
    enabled: false

# AWS Configuration
aws:
  region: ${AWS_REGION:us-east-1}

# Spring Boot Actuator Configuration - Enterprise
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
        exclude: shutdown,env,configprops,beans,mappings,loggers,threaddump,heapdump,jfr
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: always
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    redis:
      enabled: false # Desabilitar se Redis não estiver disponível
    db:
      enabled: true
    diskspace:
      enabled: true
      threshold: 10GB
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s
  tracing:
    sampling:
      probability: 0.1 # 10% de sampling para produção
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
    git:
      enabled: true

vynlo:
  features:
    new-ui: ${FEATURE_NEW_UI:true}
    analytics: ${FEATURE_ANALYTICS:false}
    beta-features: ${FEATURE_BETA:true}
  
  rate-limit:
    requests-per-minute: 1000
    burst-capacity: 100
  
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers: "*"
    allow-credentials: true

logging:
  level:
    com.vynlotaste: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  error:
    include-stacktrace: on-param