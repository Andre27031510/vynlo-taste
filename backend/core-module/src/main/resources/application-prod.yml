spring:
  main:
    lazy-initialization: false
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:50} # Aumentado para 3M usuários
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000} # Reduzido
      idle-timeout: ${DB_IDLE_TIMEOUT:300000} # Reduzido
      max-lifetime: ${DB_MAX_LIFETIME:900000} # Reduzido
      leak-detection-threshold: 30000 # Reduzido
      auto-commit: false
      initialization-fail-timeout: 10000

  redis:
    cluster:
      nodes: ${REDIS_CLUSTER_NODES:redis-cluster.vynlotech.com:6379}
    password: ${REDIS_PASSWORD}
    timeout: ${REDIS_TIMEOUT:2000ms} # Reduzido para produção
    connect-timeout: ${REDIS_CONNECT_TIMEOUT:2000ms}
    lettuce:
      pool:
        max-active: ${REDIS_POOL_MAX:100} # Aumentado para alta carga
        max-idle: ${REDIS_POOL_IDLE:20}
        min-idle: ${REDIS_POOL_MIN:10}
        max-wait: ${REDIS_POOL_WAIT:1000ms} # Reduzido
      shutdown-timeout: 100ms
    ssl: true # Habilitado para produção

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    connect-retries: 3
    connect-retries-interval: 2s
    out-of-order: true
    ignore-missing-migrations: true
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: false

  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_TTL:300000} # 5 minutos para alta carga
      cache-null-values: false
      use-key-prefix: true
      enable-statistics: true # Para monitoramento
      
  mail:
    test-connection: false

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  private-key: ${FIREBASE_PRIVATE_KEY:}
  client-email: ${FIREBASE_CLIENT_EMAIL:}
  aws-secret-name: ${FIREBASE_AWS_SECRET_NAME:vynlo-taste-firebase-prod}

aws:
  region: ${AWS_REGION:us-east-1}

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000}
    aws-secret-name: ${JWT_AWS_SECRET_NAME:vynlo-taste-jwt-prod}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
        exclude: shutdown,env,configprops,beans,mappings,loggers,threaddump,heapdump,jfr
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: always
      enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    redis:
      enabled: false
    db:
      enabled: false
    diskspace:
      enabled: false
      threshold: 1GB
  metrics:
    export:
      prometheus:
        enabled: true
        step: 30s
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s
  tracing:
    sampling:
      probability: 0.01
  info:
    env:
      enabled: false
    java:
      enabled: true
    os:
      enabled: false
    build:
      enabled: true
    git:
      enabled: false

vynlo:
  features:
    new-ui: ${FEATURE_NEW_UI:false}
    analytics: ${FEATURE_ANALYTICS:true}
    beta-features: ${FEATURE_BETA:false}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:1000} # Aumentado para 3M usuários
    burst-capacity: ${RATE_LIMIT_BURST:100}
    distributed: true # Rate limiting distribuído
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:https://vynlotech.com,https://vynlotaste.com,https://admin.vynlotech.com,https://cdn.vynlotech.com,https://api.vynlotech.com}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Requested-With
      - X-Request-ID
    allow-credentials: true
    max-age: 3600
  backup:
    enabled: ${BACKUP_ENABLED:true}
    schedule: ${BACKUP_SCHEDULE:0 0 2 * * *}
    retention-days: ${BACKUP_RETENTION:30}
    s3-bucket: ${BACKUP_S3_BUCKET}

logging:
  level:
    com.vynlotaste: ${LOG_LEVEL:INFO}
    org.springframework: WARN
    org.hibernate: WARN
  file:
    name: ${LOG_FILE_PATH:/var/log/vynlo-taste/application.log}
    max-size: ${LOG_MAX_SIZE:100MB}
    max-history: ${LOG_MAX_HISTORY:30}
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] [%X{traceId:-}] %logger{36} - %msg%n"

server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${SSL_ENABLED:true} # Habilitado para produção
    key-store: ${SSL_KEYSTORE_PATH}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  http2:
    enabled: true # Habilitado para performance
  tomcat:
    connection-timeout: 10000 # Reduzido
    keep-alive-timeout: 30000 # Reduzido
    max-connections: 20000 # Aumentado para 3M usuários
    threads:
      max: 500 # Aumentado
      min-spare: 50 # Aumentado
    accept-count: 1000 # Adicionado
    max-http-post-size: 2MB # Limitado