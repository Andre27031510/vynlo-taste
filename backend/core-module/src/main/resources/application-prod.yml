# ============================================================================
# APPLICATION CONFIGURATION - PRODUCTION
# ============================================================================
# Configuração específica para ambiente de produção
# Otimizado para performance, segurança e observability
#
# ATIVADO VIA: SPRING_PROFILES_ACTIVE=prod
#
# @version 1.0.0
# @created 2025-10-20
# ============================================================================

spring:
  jpa:
    show-sql: false  # ✅ Desabilitar SQL logs em produção
    properties:
      hibernate:
        format_sql: false  # ✅ Desabilitar formatação
        use_sql_comments: false  # ✅ Desabilitar comentários

# ============================================================================
# ACTUATOR - MONITORING & OBSERVABILITY (Fase 2)
# ============================================================================
# Expõe métricas para Prometheus e health checks para AWS Load Balancer
# 
# ENDPOINTS EXPOSTOS:
# - /api/actuator/health (público - ALB health check)
# - /api/actuator/prometheus (público - Prometheus scraping)
# - /api/actuator/info (público - informações da aplicação)
# - /api/actuator/metrics (restrito - métricas detalhadas)
#
# SEGURANÇA:
# - Endpoints protegidos via SecurityConfig.java
# - Sem informações sensíveis expostas
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # ✅ ADICIONAR prometheus
      base-path: /api/actuator
  
  endpoint:
    health:
      show-details: when-authorized  # ✅ Detalhes apenas para autenticados
      probes:
        enabled: true  # ✅ Liveness e readiness probes (Kubernetes-ready)
    
    prometheus:
      enabled: true  # ✅ CRÍTICO: Habilitar endpoint Prometheus
    
    metrics:
      enabled: true
  
  # ============================================================================
  # MÉTRICAS PROMETHEUS
  # ============================================================================
  metrics:
    tags:
      application: ${spring.application.name}
      environment: prod
      version: 2.1.1
    
    # Habilitar métricas específicas
    enable:
      jvm: true
      process: true
      system: true
      tomcat: true
      logback: true
      hikaricp: true  # ✅ Connection pool metrics
      cache: true     # ✅ Cache metrics (Caffeine + Redis)
    
    # Distribuição de latência (percentis)
    distribution:
      percentiles-histogram:
        http.server.requests: true  # ✅ P50, P90, P95, P99
      slo:
        http.server.requests: 100ms,200ms,500ms,1s  # ✅ SLOs customizados
    
    # Exportar para Prometheus
    export:
      prometheus:
        enabled: true
        step: 1m  # Intervalo de agregação
        descriptions: true  # Incluir descrições das métricas

# ============================================================================
# LOGGING - PRODUCTION OPTIMIZED
# ============================================================================
# Reduzir verbosidade de logs para economizar espaço e melhorar performance
# ============================================================================
logging:
  level:
    root: INFO
    com.vynlotaste: WARN  # ✅ Apenas WARN/ERROR em produção
    org.springframework: INFO
    org.hibernate: WARN
    org.springframework.cache: WARN
    org.springframework.data: WARN
  
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] [%X{tenantId:-}] %logger{36} - %msg%n"
  
  # Configurar arquivo de log (rotação automática)
  file:
    name: /var/log/vynlo-taste/application.log
    max-size: 100MB
    max-history: 30  # Manter logs por 30 dias
    total-size-cap: 1GB

# ============================================================================
# CACHE - PRODUCTION TUNING
# ============================================================================
spring:
  cache:
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m,recordStats  # ✅ TTL 10min + stats
