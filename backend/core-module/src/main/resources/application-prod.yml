# ============================================================================
# APPLICATION CONFIGURATION - PRODUCTION
# ============================================================================
# Configuração específica para ambiente de produção
# Otimizado para performance, segurança e observability
#
# ATIVADO VIA: SPRING_PROFILES_ACTIVE=prod
#
# @version 1.0.0
# @created 2025-10-20
# ============================================================================

# ============================================================================
# SPRING CONFIGURATION
# ============================================================================
spring:
  # ==========================================================================
  # DATABASE CONFIGURATION (PostgreSQL)
  # ==========================================================================
  # Configuração usando variáveis de ambiente do Docker Compose
  # Padrão enterprise: 12-factor app (config via env vars)
  # ==========================================================================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vynlotaste}
    username: ${DB_USERNAME:vynlo_user}
    password: ${DB_PASSWORD:vynlo_pass}
    driver-class-name: org.postgresql.Driver
    
    # HikariCP - Connection Pool (usado por Netflix, Uber)
    hikari:
      maximum-pool-size: 20  # Produção: mais conexões
      minimum-idle: 5        # Mínimo de conexões idle
      connection-timeout: 30000  # 30 segundos
      idle-timeout: 600000      # 10 minutos
      max-lifetime: 1800000     # 30 minutos
      leak-detection-threshold: 60000  # Detectar connection leaks
  
  # ==========================================================================
  # REDIS CONFIGURATION (Cache L2)
  # ==========================================================================
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
  
  # ==========================================================================
  # JPA/HIBERNATE CONFIGURATION
  # ==========================================================================
  jpa:
    hibernate:
      ddl-auto: validate  # Produção: NUNCA use create/update
    show-sql: false  # ✅ Desabilitar SQL logs em produção
    properties:
      hibernate:
        format_sql: false  # ✅ Desabilitar formatação
        use_sql_comments: false  # ✅ Desabilitar comentários
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  # ==========================================================================
  # FLYWAY CONFIGURATION (Database Migrations)
  # ==========================================================================
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  # ==========================================================================
  # CACHE - PRODUCTION TUNING
  # ==========================================================================
  cache:
    type: caffeine  # L1 cache (multi-level com Redis L2 configurado via código)
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m,recordStats  # ✅ TTL 10min + stats

# ============================================================================
# ACTUATOR - MONITORING & OBSERVABILITY (Fase 2)
# ============================================================================
# Expõe métricas para Prometheus e health checks para AWS Load Balancer
# 
# IMPORTANTE:
# - server.servlet.context-path: /api (application.yml)
# - management.endpoints.web.base-path: /actuator (SEM /api)
# - RESULTADO: /api/actuator (CORRETO!)
#
# ENDPOINTS EXPOSTOS:
# - /api/actuator/health (público - ALB health check)
# - /api/actuator/prometheus (público - Prometheus scraping)
# - /api/actuator/info (público - informações da aplicação)
# - /api/actuator/metrics (restrito - métricas detalhadas)
#
# SEGURANÇA:
# - Endpoints protegidos via SecurityConfig.java
# - Sem informações sensíveis expostas
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # ✅ Expor prometheus
      base-path: /actuator  # ✅ SEM /api (context-path já adiciona)
  
  endpoint:
    health:
      show-details: when-authorized  # ✅ Detalhes apenas para autenticados
      probes:
        enabled: true  # ✅ Liveness e readiness probes (Kubernetes-ready)
    
    prometheus:
      enabled: true  # ✅ CRÍTICO: Habilitar endpoint Prometheus
    
    metrics:
      enabled: true
  
  # ============================================================================
  # MÉTRICAS PROMETHEUS
  # ============================================================================
  metrics:
    tags:
      application: ${spring.application.name}
      environment: prod
      version: 2.1.1
    
    # Habilitar métricas específicas
    enable:
      jvm: true
      process: true
      system: true
      tomcat: true
      logback: true
      hikaricp: true  # ✅ Connection pool metrics
      cache: true     # ✅ Cache metrics (Caffeine + Redis)
    
    # Distribuição de latência (percentis)
    distribution:
      percentiles-histogram:
        http.server.requests: true  # ✅ P50, P90, P95, P99
      slo:
        http.server.requests: 100ms,200ms,500ms,1s  # ✅ SLOs customizados
    
    # Exportar para Prometheus
    export:
      prometheus:
        enabled: true
        step: 1m  # Intervalo de agregação
        descriptions: true  # Incluir descrições das métricas

# ============================================================================
# LOGGING - PRODUCTION OPTIMIZED
# ============================================================================
# Reduzir verbosidade de logs para economizar espaço e melhorar performance
# ============================================================================
logging:
  level:
    root: INFO
    com.vynlotaste: WARN  # ✅ Apenas WARN/ERROR em produção
    org.springframework: INFO
    org.hibernate: WARN
    org.springframework.cache: WARN
    org.springframework.data: WARN
  
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] [%X{tenantId:-}] %logger{36} - %msg%n"
  
  # Configurar arquivo de log (rotação automática)
  file:
    name: /var/log/vynlo-taste/application.log
    max-size: 100MB
    max-history: 30  # Manter logs por 30 dias
    total-size-cap: 1GB
