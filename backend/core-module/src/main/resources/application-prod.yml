spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_MAX_LIFETIME:900000}
      leak-detection-threshold: 0
      auto-commit: true
      initialization-fail-timeout: 10000

  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: ${REDIS_TIMEOUT:3000ms}
    lettuce:
      pool:
        max-active: ${REDIS_POOL_MAX:10}
        max-idle: ${REDIS_POOL_IDLE:5}
        min-idle: ${REDIS_POOL_MIN:2}
        max-wait: ${REDIS_POOL_WAIT:3000ms}

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    connect-retries: 3
    connect-retries-interval: 10s
    lock-retry-count: 3
    
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: false

  cache:
    redis:
      time-to-live: ${CACHE_TTL:1800000} # 30 minutos produção
      
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 3000
          writetimeout: 5000

firebase:
  project-id: ${FIREBASE_PROJECT_ID:}
  private-key: ${FIREBASE_PRIVATE_KEY:}
  client-email: ${FIREBASE_CLIENT_EMAIL:}
  aws-secret-name: ${FIREBASE_AWS_SECRET_NAME:vynlo-taste-firebase-prod}

aws:
  region: ${AWS_REGION:us-east-1}

security:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000}
    aws-secret-name: ${JWT_AWS_SECRET_NAME:vynlo-taste-jwt-prod}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
        exclude: shutdown,env,configprops,beans,mappings,loggers,threaddump,heapdump,jfr
      base-path: /actuator
  endpoint:
    health:
      show-details: never
      show-components: always
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: true
      threshold: 1GB
  metrics:
    export:
      prometheus:
        enabled: true
        step: 30s
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s
  tracing:
    sampling:
      probability: 0.01
  info:
    env:
      enabled: false
    java:
      enabled: true
    os:
      enabled: false
    build:
      enabled: true
    git:
      enabled: false

vynlo:
  features:
    new-ui: ${FEATURE_NEW_UI:false}
    analytics: ${FEATURE_ANALYTICS:true}
    beta-features: ${FEATURE_BETA:false}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_RPM:300}
    burst-capacity: ${RATE_LIMIT_BURST:30}
  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:https://vynlotech.com,https://vynlotaste.com,https://admin.vynlotech.com}
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - Authorization
      - Content-Type
      - X-Requested-With
      - X-Request-ID
    allow-credentials: true
    max-age: 3600
  ssl:
    enabled: true
    key-store: ${SSL_KEYSTORE_PATH}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: ${SSL_KEYSTORE_TYPE:PKCS12}
    trust-store: ${SSL_TRUSTSTORE_PATH}
    trust-store-password: ${SSL_TRUSTSTORE_PASSWORD}
  backup:
    enabled: ${BACKUP_ENABLED:true}
    schedule: ${BACKUP_SCHEDULE:0 2 * * *}
    retention-days: ${BACKUP_RETENTION:30}
    s3-bucket: ${BACKUP_S3_BUCKET}

logging:
  level:
    com.vynlotaste: ${LOG_LEVEL:INFO}
    org.springframework: WARN
    org.hibernate: WARN
  file:
    name: ${LOG_FILE_PATH:/var/log/vynlo-taste/application.log}
    max-size: ${LOG_MAX_SIZE:100MB}
    max-history: ${LOG_MAX_HISTORY:30}
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] [%X{traceId:-}] %logger{36} - %msg%n"

server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: ${SSL_KEYSTORE_PATH}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: ${SSL_KEYSTORE_TYPE:PKCS12}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  http2:
    enabled: ${HTTP2_ENABLED:true}
