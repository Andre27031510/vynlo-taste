# ============================================================================
# PROMETHEUS CONFIGURATION - Vynlo Taste
# ============================================================================
# Configuração enterprise-grade para monitoring de aplicações Spring Boot
# 
# OBJETIVOS:
# ✅ Coletar métricas do backend (Spring Boot Actuator)
# ✅ Métricas de multi-tenancy (por tenant_id)
# ✅ Performance metrics (latency, throughput)
# ✅ Business metrics (orders, revenue, products)
# ✅ Infrastructure metrics (JVM, database, cache)
#
# PADRÃO: Google SRE - Four Golden Signals
# - Latency (tempo de resposta)
# - Traffic (requisições por segundo)
# - Errors (taxa de erro)
# - Saturation (uso de recursos)
#
# BENEFÍCIOS: MTTR -90%, SLA 99.9%, Troubleshooting 10x mais rápido
#
# @version 1.0.0
# @created 2025-10-20
# ============================================================================

global:
  scrape_interval: 15s      # Intervalo de coleta (padrão: 15s)
  evaluation_interval: 15s  # Intervalo de avaliação de regras
  
  # Labels externos (aplicados a todas as métricas)
  external_labels:
    cluster: 'vynlo-production'
    environment: 'prod'
    monitor: 'vynlo-taste-monitor'

# Configuração de alertas (integração futura com AlertManager)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093  # Descomentar quando AlertManager estiver ativo

# Regras de alertas (carregadas de arquivos externos)
rule_files:
  # - "alerts/*.yml"  # Alertas customizados

# Jobs de scraping (onde coletar métricas)
scrape_configs:
  
  # ========================================================================
  # JOB 1: PROMETHEUS SELF-MONITORING
  # ========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
  
  # ========================================================================
  # JOB 2: VYNLO BACKEND (Spring Boot Actuator)
  # ========================================================================
  - job_name: 'vynlo-backend'
    
    # Configuração de scraping
    scrape_interval: 10s      # Coleta a cada 10s (mais frequente que global)
    scrape_timeout: 5s        # Timeout de 5s
    
    # Métricas path (Spring Boot Actuator padrão)
    metrics_path: '/api/actuator/prometheus'
    
    # Targets
    static_configs:
      - targets: ['backend:8080']  # Nome do serviço no Docker Compose
        labels:
          service: 'vynlo-backend'
          application: 'vynlo-taste'
          tier: 'backend'
          language: 'java'
          framework: 'spring-boot'
    
    # Relabeling (adicionar/modificar labels)
    relabel_configs:
      # Adicionar label de instance
      - source_labels: [__address__]
        target_label: instance
      
      # Adicionar label de job_name
      - source_labels: [job]
        target_label: job_name
  
  # ========================================================================
  # JOB 3: REDIS (Exporter)
  # ========================================================================
  # TODO: Adicionar redis_exporter quando necessário
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  
  # ========================================================================
  # JOB 4: POSTGRESQL (Exporter)
  # ========================================================================
  # TODO: Adicionar postgres_exporter quando necessário
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  
  # ========================================================================
  # JOB 5: NODE EXPORTER (métricas do servidor Ubuntu)
  # ========================================================================
  # TODO: Adicionar node_exporter quando necessário
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

# ============================================================================
# CONFIGURAÇÃO DE STORAGE
# ============================================================================
# Prometheus armazena métricas em TSDB (Time Series Database)
# Retenção padrão: 15 dias (configurável via flag --storage.tsdb.retention.time)
# ============================================================================

