# ============================================================================
# GRAFANA DATASOURCE - Prometheus
# ============================================================================
# Configuração automática de datasource Prometheus para Grafana
# 
# IMPORTANTE:
# - Este arquivo é lido automaticamente pelo Grafana ao iniciar
# - Não precisa configurar manualmente pela UI
# - Datasource fica disponível imediatamente
#
# @version 1.0.0
# @created 2025-10-20
# ============================================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      
    # Labels para organização
    orgId: 1
    version: 1

