# ============================================================================
# GRAFANA DASHBOARD PROVISIONING
# ============================================================================
# Configuração automática de dashboards do Grafana
# Dashboards são carregados automaticamente ao iniciar
#
# @version 1.0.0
# @created 2025-10-20
# ============================================================================

apiVersion: 1

providers:
  - name: 'Vynlo Dashboards'
    orgId: 1
    folder: 'Vynlo Taste'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true

