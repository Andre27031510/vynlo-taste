name: CI/CD-v2
# Workflow de CI/CD com validações fail-fast e deploy zero-downtime
# Documentação: docs/BIG_TECH_PIPELINE_REFACTOR.md
# touch: redeploy note (commit 0b28909) - comentário leve sem impacto funcional - atualizado para forçar push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write  # Obrigatório para OIDC com AWS

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.sha }}
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend_any_changed }}
      frontend_changed: ${{ steps.changes.outputs.frontend_any_changed }}
      infra_changed: ${{ steps.changes.outputs.infra_any_changed }}
      migrations_changed: ${{ steps.changes.outputs.migrations_any_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Debug event
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
      - name: Detect changes
        id: changes
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            infra:
              - 'docker-compose.prod.yml'
              - '.github/workflows/**'
            migrations:
              - 'backend/**/db/migration/**'
      - name: Debug context outputs
        run: |
          echo "Debug: backend_any_changed = ${{ steps.changes.outputs.backend_any_changed || 'null' }}"
          echo "Debug: frontend_any_changed = ${{ steps.changes.outputs.frontend_any_changed || 'null' }}"
          echo "Debug: infra_any_changed = ${{ steps.changes.outputs.infra_any_changed || 'null' }}"
          echo "Debug: migrations_any_changed = ${{ steps.changes.outputs.migrations_any_changed || 'null' }}"
          echo "Debug: context validation complete"
      - name: Verify Ekklesia routing pattern
        if: ${{ steps.changes.outputs.backend_any_changed == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          echo "🔍 Verificando padrão de roteamento Ekklesia..."
          echo ""
          
          # Buscar controllers Ekklesia que violam o padrão
          VIOLATIONS=$(find backend/core-module/src/main/java/com/vynlotaste/controller/church -name "*.java" -type f 2>/dev/null | xargs grep -l '@RequestMapping.*"/api/' 2>/dev/null || true)
          
          if [ -n "$VIOLATIONS" ]; then
            echo "❌ ERRO: Encontrados controllers Ekklesia com prefixo /api/ no @RequestMapping:"
            echo ""
            echo "$VIOLATIONS"
            echo ""
            echo "📋 REGRA: Controllers Ekklesia NÃO devem ter /api/ no @RequestMapping"
            echo "   Context-path=/api já está configurado em application.yml"
            echo "   Use: @RequestMapping(\"/v1/ekklesia/...\")"
            echo "   ❌ ERRADO: @RequestMapping(\"/api/v1/ekklesia/...\")"
            echo ""
            echo "🔧 Como corrigir:"
            echo "   1. Remova /api do @RequestMapping"
            echo "   2. Mantenha apenas /v1/ekklesia/..."
            echo ""
            exit 1
          else
            echo "✅ Nenhuma violação encontrada: controllers Ekklesia seguem o padrão correto"
          fi
          
          echo "✅ Verificação de roteamento concluída"
      - uses: docker/setup-buildx-action@v3

      - name: Validate secrets
        run: |
          set -euo pipefail
          echo "Validating required secrets..."
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "::error::GITHUB_TOKEN is required but not available"
            exit 1
          fi
          echo "✅ GITHUB_TOKEN available"
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize owner (lowercase)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          if [ -z "$OWNER" ]; then
            OWNER="andre27031510"
            echo "Using fallback owner: $OWNER"
          fi
          echo "OWNER_LC=$OWNER" >> $GITHUB_ENV
          echo "Debug: OWNER_LC set to $OWNER"
      - name: Validate context outputs
        run: |
          echo "Validating context outputs for self-hosted runner..."
          BACKEND_CHANGED="${{ steps.changes.outputs.backend_any_changed || 'null' }}"
          FRONTEND_CHANGED="${{ steps.changes.outputs.frontend_any_changed || 'null' }}"
          INFRA_CHANGED="${{ steps.changes.outputs.infra_any_changed || 'null' }}"
          
          if [ "$BACKEND_CHANGED" = "" ] || [ "$BACKEND_CHANGED" = "null" ]; then
            BACKEND_CHANGED="true"
            echo "Backend changed: fallback to true (context not available)"
          else
            echo "Backend changed: $BACKEND_CHANGED"
          fi
          
          if [ "$FRONTEND_CHANGED" = "" ] || [ "$FRONTEND_CHANGED" = "null" ]; then
            FRONTEND_CHANGED="true"
            echo "Frontend changed: fallback to true (context not available)"
          else
            echo "Frontend changed: $FRONTEND_CHANGED"
          fi
          
          if [ "$INFRA_CHANGED" = "" ] || [ "$INFRA_CHANGED" = "null" ]; then
            INFRA_CHANGED="true"
            echo "Infra changed: fallback to true (context not available)"
          else
            echo "Infra changed: $INFRA_CHANGED"
          fi
          
          echo "Owner LC: andre27031510"
          echo "Context validation complete"
      # Testes e lints - Build não publica imagem sem passar testes
      
      - name: Setup Java for Backend Tests
        if: ${{ steps.changes.outputs.backend_any_changed == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Run Backend Tests
        if: ${{ steps.changes.outputs.backend_any_changed == 'true' || github.event_name == 'workflow_dispatch' }}
        working-directory: backend/core-module
        run: |
          echo "🧪 Executando testes do backend..."
          mvn test -DskipTests=false
          echo "✅ Testes do backend concluídos"
          
      - name: Setup Node.js for Frontend
        if: ${{ steps.changes.outputs.frontend_any_changed == 'true' || steps.changes.outputs.infra_any_changed == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Install Frontend Dependencies
        if: ${{ steps.changes.outputs.frontend_any_changed == 'true' || steps.changes.outputs.infra_any_changed == 'true' || github.event_name == 'workflow_dispatch' }}
        working-directory: frontend
        run: |
          echo "📦 Instalando dependências do frontend..."
          npm ci
          echo "✅ Dependências instaladas"
          
      - name: Run Frontend Lint
        if: ${{ steps.changes.outputs.frontend_any_changed == 'true' || steps.changes.outputs.infra_any_changed == 'true' || github.event_name == 'workflow_dispatch' }}
        working-directory: frontend
        run: |
          echo "🔍 Executando lint do frontend..."
          npm run lint || {
            echo "⚠️ Lint encontrou problemas"
            echo "   Errors críticos bloqueiam o build"
            echo "   Warnings permitidos: 750 (temporário - limpeza em progresso)"
            echo "   Meta: reduzir para 0 em 2-3 sprints"
            echo "   Estratégia: docs/ESLINT_CLEANUP_STRATEGY.md"
            exit 1
          }
          echo "✅ Lint do frontend concluído"
          
      - name: Run Frontend Tests
        if: ${{ steps.changes.outputs.frontend_any_changed == 'true' || steps.changes.outputs.infra_any_changed == 'true' || github.event_name == 'workflow_dispatch' }}
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.vynlotech.com' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          echo "🧪 Executando testes do frontend..."
          npm run test
          echo "✅ Testes do frontend concluídos"

      - name: Frontend Build
        if: ${{ steps.changes.outputs.frontend_any_changed == 'true' || steps.changes.outputs.infra_any_changed == 'true' || github.event_name == 'workflow_dispatch' }}
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.vynlotech.com' }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          echo "🔨 Build do frontend..."
          npm run build
          echo "✅ Build concluído"
      - name: Build and push backend image
        if: ${{ steps.changes.outputs.backend_any_changed == 'true' || steps.changes.outputs.infra_any_changed == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/andre27031510/vynlotaste-backend:${{ env.TAG }}
            ghcr.io/andre27031510/vynlotaste-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        if: ${{ steps.changes.outputs.frontend_any_changed == 'true' || steps.changes.outputs.infra_any_changed == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/andre27031510/vynlotaste-frontend:${{ env.TAG }}
            ghcr.io/andre27031510/vynlotaste-frontend:latest
          # CACHE TEMPORARIAMENTE DESABILITADO para forçar rebuild completo
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
          no-cache: true
          build-args: |
            # NEXT_PUBLIC_API_URL SEM /api no final (buildApiUrl adiciona automaticamente)
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'https://api.vynlotech.com' }}
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
  
  staging-migrations:
    name: Flyway Migrations (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate obrigatório: valida migrations antes do deploy em produção
    if: ${{ github.event_name != 'pull_request' && (needs.build.outputs.backend_changed == 'true' || needs.build.outputs.migrations_changed == 'true' || github.event_name == 'workflow_dispatch') }}
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Setup PostgreSQL (Staging)
        run: |
          echo "🐘 Iniciando PostgreSQL temporário para staging..."
          docker run -d \
            --name postgres-staging \
            -e POSTGRES_USER=vynlo_user \
            -e POSTGRES_PASSWORD=staging_pass \
            -e POSTGRES_DB=vynlotaste \
            -p 5433:5432 \
            postgres:15-alpine
          sleep 5
          echo "✅ PostgreSQL staging pronto"
          
      - name: Run Flyway Migrations (Staging)
        working-directory: backend/core-module
        run: |
          echo "🔄 Executando migrações Flyway em staging..."
          # Usa -DskipTests para não executar testes (já executados no job build)
          mvn flyway:migrate \
            -DskipTests=true \
            -Dflyway.url=jdbc:postgresql://localhost:5433/vynlotaste \
            -Dflyway.user=vynlo_user \
            -Dflyway.password=staging_pass \
            -Dflyway.baselineOnMigrate=true \
            -Dflyway.validateOnMigrate=true || {
            echo "❌ ERRO: Migrações Flyway falharam em staging"
            echo "   Isso indica problemas que devem ser corrigidos antes do deploy em produção"
            exit 1
          }
          echo "✅ Migrações Flyway executadas com sucesso em staging"
          
      - name: Cleanup PostgreSQL (Staging)
        if: always()
        run: |
          docker stop postgres-staging || true
          docker rm postgres-staging || true
          echo "🧹 PostgreSQL staging removido"
          
  deploy:
    needs: [build, staging-migrations]
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    # Deploy apenas se build e staging-migrations passaram
    if: ${{ needs.build.result == 'success' && needs.staging-migrations.result == 'success' && (needs.build.outputs.backend_changed == 'true' || needs.build.outputs.frontend_changed == 'true' || needs.build.outputs.infra_changed == 'true' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4

      - name: Debug build outputs for self-hosted runner
        run: |
          echo "=== Self-Hosted Runner Context Debug ==="
          echo "Runner name: $(hostname)"
          echo "Runner user: $(whoami)"
          echo "Backend changed: ${{ needs.build.outputs.backend_changed || 'null/undefined' }}"
          echo "Frontend changed: ${{ needs.build.outputs.frontend_changed || 'null/undefined' }}"
          echo "Infra changed: ${{ needs.build.outputs.infra_changed || 'null/undefined' }}"
          echo "Event name: ${{ github.event_name || 'unknown' }}"
          echo "GitHub ref: ${{ github.ref || 'unknown' }}"
          echo "GitHub sha: ${{ github.sha || 'unknown' }}"
          echo "=== Context validation complete ==="
      - name: Validate secrets and environment
        run: |
          echo "=== Validating secrets and environment for self-hosted runner ==="
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then echo "GitHub token: available"; else echo "GitHub token: not available"; fi
          if [ -n "${{ secrets.SSH_HOST }}" ]; then echo "SSH host: configured"; else echo "SSH host: using localhost fallback"; fi
          echo "Backend changed: ${{ needs.build.outputs.backend_changed || 'null' }}"
          echo "Frontend changed: ${{ needs.build.outputs.frontend_changed || 'null' }}"
          echo "Infra changed: ${{ needs.build.outputs.infra_changed || 'null' }}"
          echo "Commit SHA: ${{ github.sha || 'unknown' }}"
          echo "=== Validation complete ==="
      
      # AWS Secrets Manager: Configurar OIDC e Ler Secrets
      
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::051826695275:role/GitHubActionsDeployRole' }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: GitHubActions-${{ github.run_id }}
          
      - name: Fetch runtime secrets from AWS Secrets Manager
        id: fetch-secrets
        env:
          AWS_RUNTIME_SECRET_ID: ${{ secrets.AWS_RUNTIME_SECRET_ID || 'vynlo-taste-runtime-secrets' }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          echo "🔐 Buscando secrets do AWS Secrets Manager..."
          
          START_TIME=$(date +%s)
          SECRET_ID="${AWS_RUNTIME_SECRET_ID}"
          AWS_REGION_VAR="${AWS_REGION}"
          
          echo "📦 Buscando secret: ${SECRET_ID} (região: ${AWS_REGION_VAR})"
          
          # Validar que secret ID foi fornecido
          if [ -z "${SECRET_ID}" ]; then
            echo "❌ ERRO CRÍTICO: AWS_RUNTIME_SECRET_ID não está definido"
            echo "   Configure o secret 'AWS_RUNTIME_SECRET_ID' no GitHub ou defina como variável de ambiente"
            exit 1
          fi
          
          # Descrever secret (valida existência e permissões)
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "${SECRET_ID}" \
            --region "${AWS_REGION_VAR}" \
            --query 'ARN' --output text 2>&1) || {
            echo "❌ ERRO: Não foi possível descrever secret ${SECRET_ID}"
            echo "   Verifique se o secret existe no AWS Secrets Manager"
            echo "   Verifique se a role IAM tem permissão para ler o secret"
            exit 1
          }
          echo "✅ Secret ARN: ${SECRET_ARN}"
          
          # Buscar valor do secret (JSON completo)
          SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id "${SECRET_ID}" \
            --region "${AWS_REGION_VAR}" \
            --query 'SecretString' --output text 2>&1) || {
            echo "❌ ERRO: Não foi possível ler secret ${SECRET_ID}"
            exit 1
          }
          
          # Validar que JSON não está vazio
          if [ -z "${SECRET_JSON}" ] || [ "${SECRET_JSON}" = "null" ]; then
            echo "❌ ERRO CRÍTICO: Secret ${SECRET_ID} está vazio ou inválido"
            exit 1
          fi
          
          # Extrair campos do JSON (usando jq se disponível, senão Python)
          if command -v jq &> /dev/null; then
            DB_PASSWORD=$(echo "${SECRET_JSON}" | jq -r '.DB_PASSWORD // .password // empty')
            MAIL_PASSWORD=$(echo "${SECRET_JSON}" | jq -r '.MAIL_PASSWORD // .mail_password // empty')
          else
            # Fallback: usar Python (disponível na maioria dos runners)
            DB_PASSWORD=$(echo "${SECRET_JSON}" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('DB_PASSWORD') or d.get('password') or '')")
            MAIL_PASSWORD=$(echo "${SECRET_JSON}" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('MAIL_PASSWORD') or d.get('mail_password') or '')")
          fi
          
          # Validar secrets obrigatórios logo após buscar
          if [ -z "${DB_PASSWORD}" ] || [ "${DB_PASSWORD}" = "null" ]; then
            echo "❌ ERRO CRÍTICO: DB_PASSWORD não encontrado no secret ${SECRET_ID}"
            echo "   O secret deve conter campo 'DB_PASSWORD' ou 'password'"
            echo "   Formato esperado: {\"DB_PASSWORD\": \"...\", \"MAIL_PASSWORD\": \"...\"}"
            exit 1
          fi
          echo "✅ DB_PASSWORD recuperado com sucesso (${#DB_PASSWORD} caracteres)"
          
          if [ -z "${MAIL_PASSWORD}" ] || [ "${MAIL_PASSWORD}" = "null" ]; then
            echo "⚠️ AVISO: MAIL_PASSWORD não encontrado no secret ${SECRET_ID}"
            echo "   Email pode não funcionar"
            echo "   O secret deve conter campo 'MAIL_PASSWORD' ou 'mail_password'"
            MAIL_PASSWORD=""
          else
            echo "✅ MAIL_PASSWORD recuperado com sucesso (${#MAIL_PASSWORD} caracteres)"
          fi
          
          # Validar Firebase secret (backend lê em runtime, mas validamos existência)
          echo "📦 Validando secret: vynlo-taste-firebase-prod (backend lê em runtime)"
          FIREBASE_SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id vynlo-taste-firebase-prod \
            --region us-east-1 \
            --query 'ARN' --output text 2>&1) || {
            echo "⚠️ AVISO: Secret vynlo-taste-firebase-prod não encontrado ou sem permissão"
            echo "   Backend pode não inicializar Firebase corretamente"
          }
          if [ -n "${FIREBASE_SECRET_ARN}" ]; then
            echo "✅ Firebase secret existe e está acessível: ${FIREBASE_SECRET_ARN}"
            echo "   Backend buscará automaticamente em runtime via AwsSecretsService"
          fi
          
          # Validar JWT secret (backend lê em runtime, mas validamos existência)
          echo "📦 Validando secret: vynlo-taste-jwt-prod (backend lê em runtime)"
          JWT_SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id vynlo-taste-jwt-prod \
            --region us-east-1 \
            --query 'ARN' --output text 2>&1) || {
            echo "⚠️ AVISO: Secret vynlo-taste-jwt-prod não encontrado ou sem permissão"
            echo "   Backend usará fallback (não recomendado para produção)"
          }
          if [ -n "${JWT_SECRET_ARN}" ]; then
            echo "✅ JWT secret existe e está acessível: ${JWT_SECRET_ARN}"
            echo "   Backend buscará automaticamente em runtime via AwsSecretsService"
          fi
          
          # Logs estruturados e observabilidade
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "📊 Observabilidade: Secrets validados em ${DURATION}s"
          echo "   Runtime Secret ARN: ${SECRET_ARN}"
          if [ -n "${FIREBASE_SECRET_ARN}" ]; then
            echo "   Firebase Secret ARN: ${FIREBASE_SECRET_ARN}"
          fi
          if [ -n "${JWT_SECRET_ARN}" ]; then
            echo "   JWT Secret ARN: ${JWT_SECRET_ARN}"
          fi
          
          # Exportar para GITHUB_ENV (seguro para próximos steps)
          echo "DB_PASSWORD=${DB_PASSWORD}" >> $GITHUB_ENV
          if [ -n "${MAIL_PASSWORD}" ]; then
            echo "MAIL_PASSWORD=${MAIL_PASSWORD}" >> $GITHUB_ENV
          else
            echo "MAIL_PASSWORD=" >> $GITHUB_ENV
          fi
          
          echo "✅ Secrets recuperados e validados com sucesso"
          echo "   Nota: Firebase e JWT serão lidos pelo backend em runtime automaticamente"
          
      - name: Validate deployment scripts
        run: |
          set -euo pipefail
          echo "Validating deployment scripts..."
          if [ ! -f "./deploy/scripts/deploy-application.sh" ]; then
            echo "::error::deploy-application.sh not found"
            exit 1
          fi
          if [ ! -f "./deploy/scripts/check-db-password.sh" ]; then
            echo "::error::check-db-password.sh not found"
            exit 1
          fi
          if [ ! -f "./deploy/scripts/validate-compose.sh" ]; then
            echo "::error::validate-compose.sh not found"
            exit 1
          fi
          chmod +x ./deploy/scripts/*.sh
          echo "✅ All deployment scripts validated"
      
      - name: Deploy Application
        env:
          COMMIT_SHA: ${{ github.sha }}
          OWNER_LC: ${{ env.OWNER_LC || 'andre27031510' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          SSH_HOST: ${{ secrets.SSH_HOST || 'localhost' }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
          MAIL_PASSWORD: ${{ env.MAIL_PASSWORD }}
          DEPLOY_APP_DIR: ${{ env.DEPLOY_APP_DIR || '$HOME/app' }}
        run: |
          set -euo pipefail
          chmod +x deploy/scripts/*.sh
          ./deploy/scripts/deploy-application.sh
      
      - name: Notify deployment status
        if: always()
        env:
          JOB_STATUS: ${{ job.status || 'unknown' }}
          SSH_HOST: ${{ secrets.SSH_HOST || 'localhost' }}
        run: |
          echo "=== Self-Hosted Runner Deploy Status ==="
          if [ "${JOB_STATUS}" == "success" ]; then
            echo "✅ Deploy realizado com sucesso no runner $(hostname)!"
            echo "🌐 Frontend: http://${SSH_HOST}:3000"
            echo "🔧 Backend (via proxy): http://${SSH_HOST}:3000/api/actuator/health"
            echo "📊 Commit: ${{ github.sha || 'unknown' }}"
          else
            echo "❌ Deploy falhou no runner $(hostname)!"
            echo "Status: ${JOB_STATUS}"
            echo "Verifique os logs acima para mais detalhes."
          fi
          echo "=== Status notification complete ==="

