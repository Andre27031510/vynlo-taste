<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Super Admin - Vynlo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .result.show {
            display: block;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #856404;
            font-size: 13px;
        }
        .steps {
            margin-top: 15px;
            padding-left: 20px;
        }
        .steps li {
            margin-bottom: 8px;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Setup Super Admin - Vynlo</h1>
        <p class="subtitle">Criar o primeiro Super Admin do sistema</p>
        
        <div class="warning">
            ⚠️ <strong>ATENÇÃO:</strong> Executar apenas UMA VEZ para criar o primeiro Super Admin. Depois, use a interface /super-admin para gerenciar outros usuários.
        </div>

        <form id="setupForm">
            <div class="form-group">
                <label>Email (deve ser @vynlotech.com) *</label>
                <input type="email" id="email" value="admin@vynlotech.com" required>
            </div>

            <div class="form-group">
                <label>Senha (mínimo 8 caracteres) *</label>
                <input type="password" id="password" placeholder="SuaSenhaSegura123" required>
            </div>

            <div class="form-group">
                <label>Setup Key (senha mestra) *</label>
                <input type="text" id="setupKey" value="vynlo-super-admin-2025" required readonly>
            </div>

            <button type="submit" id="submitBtn">
                Criar Super Admin
            </button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        document.getElementById('setupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            
            // Desabilitar botão
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Criando Super Admin...';
            
            // Esconder resultado anterior
            resultDiv.classList.remove('show', 'success', 'error');
            
            try {
                const response = await fetch('https://api.vynlotech.com/api/v1/setup/create-super-admin', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                        setupKey: document.getElementById('setupKey').value
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.className = 'result success show';
                    resultDiv.innerHTML = `
                        <strong>✅ Super Admin criado com sucesso!</strong>
                        <p><strong>Email:</strong> ${data.email}</p>
                        <p><strong>UID:</strong> ${data.uid}</p>
                        <p><strong>Tipo:</strong> Super Admin (acesso total)</p>
                        <div class="steps">
                            <strong>Próximos passos:</strong>
                            <ol>
                                ${data.nextSteps.map(step => `<li>${step}</li>`).join('')}
                            </ol>
                        </div>
                    `;
                    
                    // Redirecionar após 5 segundos
                    setTimeout(() => {
                        window.location.href = 'https://vynlotech.com/login';
                    }, 5000);
                } else {
                    throw new Error(data.error || 'Erro desconhecido');
                }
                
            } catch (error) {
                resultDiv.className = 'result error show';
                resultDiv.innerHTML = `
                    <strong>❌ Erro ao criar Super Admin</strong>
                    <p>${error.message}</p>
                    <p><small>Verifique se o backend está UP: <a href="https://api.vynlotech.com/api/actuator/health" target="_blank">Health Check</a></small></p>
                `;
                
                submitBtn.disabled = false;
                submitBtn.textContent = 'Tentar Novamente';
            }
        });
    </script>
</body>
</html>
